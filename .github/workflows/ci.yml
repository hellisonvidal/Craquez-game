name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Não precisa de licença: compila todo o C# contra as DLLs do editor e roda os testes da simulação.
  check:
    name: Compilar e testar (sem licença)
    runs-on: ubuntu-latest
    container: unityci/editor:ubuntu-6000.3.28f1-base-3
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - run: bash tools/ci/check.sh /opt/unity/Editor/Data

  license:
    name: Licença Unity configurada?
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.chk.outputs.ok }}
    steps:
      - id: chk
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
        run: |
          if [ -n "$UNITY_LICENSE" ] && [ -n "$UNITY_EMAIL" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Segredos UNITY_LICENSE / UNITY_EMAIL / UNITY_PASSWORD não configurados: os builds de Android e Windows foram pulados. Veja docs/BUILD.md."
          fi

  tests:
    name: Testes no editor Unity
    needs: [check, license]
    if: needs.license.outputs.ok == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-tests-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-tests-
      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Resultados dos testes

  build:
    name: Build ${{ matrix.name }}
    needs: [check, license]
    if: needs.license.outputs.ok == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android
            targetPlatform: Android
          # versão para TV (Google TV / Android TV 4K, ex.: TCL C6K): pacote próprio, 32 e 64 bits,
          # padrões de TV; instala por pen drive (docs/TV.md)
          - name: TV
            targetPlatform: Android
          - name: Linux
            targetPlatform: StandaloneLinux64
    steps:
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: true
          large-packages: false
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-${{ matrix.targetPlatform }}-
      # chave de assinatura fixa do Android (no repositório: a versão nova instala por cima da antiga,
      # e a atualização por dentro do jogo funciona); os segredos ANDROID_KEYSTORE_* têm prioridade
      - name: Chave de assinatura
        run: echo "CRAQUEZ_KS=$(base64 -w0 tools/android/craquez.keystore)" >> "$GITHUB_ENV"
      - name: Versão TV
        if: matrix.name == 'TV'
        run: |
          echo tv > Assets/Craquez/Resources/flavor.txt
          sed -i 's/^  productName: Craquez$/  productName: Craquez TV/; s/    Android: com.hellisonvidal.craquez$/    Android: com.hellisonvidal.craquez.tv/; s/^  AndroidTargetArchitectures: 2$/  AndroidTargetArchitectures: 3/' ProjectSettings/ProjectSettings.asset
          grep -n "productName\|craquez.tv\|AndroidTargetArchitectures" ProjectSettings/ProjectSettings.asset
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          allowDirtyBuild: ${{ matrix.name == 'TV' }}
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: Craquez
          versioning: None
          androidExportType: androidPackage
          # chave de assinatura fixa (segredos do repositório): sem ela cada build sai com uma chave de
          # depuração nova e o Android não aceita instalar a versão nova por cima (atualização pelo jogo)
          androidKeystoreName: craquez.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || env.CRAQUEZ_KS }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS || 'craquez2026' }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME || 'craquez' }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS || 'craquez2026' }}
      # option file completo (times, elencos, estádios, bolas, chuteiras) ao lado do executável no PC
      - name: Option file nos pacotes do PC
        if: matrix.targetPlatform == 'StandaloneWindows64' || matrix.targetPlatform == 'StandaloneLinux64'
        run: sudo cp -r option_file "build/${{ matrix.targetPlatform }}/option_file"
      - uses: actions/upload-artifact@v4
        if: matrix.targetPlatform != 'StandaloneLinux64'
        with:
          name: Craquez-${{ matrix.name }}
          path: build/${{ matrix.targetPlatform }}
          retention-days: 14
      # instalador do Windows (NSIS) com o ícone do jogo
      - name: Instalador do Windows
        if: matrix.targetPlatform == 'StandaloneWindows64'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq nsis > /dev/null
          sudo chown -R "$USER" build
          cd tools/installer
          makensis -V2 -DSRC="$GITHUB_WORKSPACE/build/StandaloneWindows64" -DOUT="$GITHUB_WORKSPACE/Craquez-Setup.exe" -DVER="1.0.${{ github.run_number }}" craquez.nsi
          ls -la "$GITHUB_WORKSPACE/Craquez-Setup.exe"
      - uses: actions/upload-artifact@v4
        if: matrix.targetPlatform == 'StandaloneWindows64'
        with:
          name: Craquez-Windows-Instalador
          path: Craquez-Setup.exe
          retention-days: 14
      # Linux: pacote .tar.gz (mantém a permissão de execução) com atalho .desktop e ícone
      - name: Pacote Linux
        if: matrix.targetPlatform == 'StandaloneLinux64'
        run: |
          sudo chown -R "$USER" build
          D=build/StandaloneLinux64
          chmod +x "$D/Craquez" || chmod +x "$D/Craquez.x86_64" || true
          cp tools/installer/linux/craquez.desktop tools/installer/linux/instalar.sh "$D/"
          chmod +x "$D/instalar.sh"
          cp tools/installer/linux/craquez.png "$D/craquez.png"
          tar czf Craquez-Linux.tar.gz -C build --transform 's,^StandaloneLinux64,Craquez,' StandaloneLinux64
          ls -la Craquez-Linux.tar.gz
      # roda o jogo (renderização por software) e tira screenshots de todas as telas e modos
      - name: Screenshots
        if: matrix.targetPlatform == 'StandaloneLinux64'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-utils mesa-vulkan-drivers libvulkan1 > /dev/null
          cd build/StandaloneLinux64
          sudo chown -R "$USER" . && chmod +x Craquez
          mkdir -p "$GITHUB_WORKSPACE/shots"
          # Unity recusa Vulkan por CPU (lavapipe) e trava no OpenGL do llvmpipe: tentativa curta, não bloqueia o CI
          for api in glcore; do
            timeout 480 xvfb-run -a -s "-screen 0 1280x720x24" ./Craquez -force-$api -screen-fullscreen 0 -screen-width 1280 -screen-height 720 \
              -logFile "$GITHUB_WORKSPACE/shots/player-$api.log" --shots="$GITHUB_WORKSPACE/shots" || echo "jogo ($api) saiu com código $?"
            ls "$GITHUB_WORKSPACE"/shots/*.png > /dev/null 2>&1 && break
          done
          ls -la "$GITHUB_WORKSPACE/shots"
          grep -E "Exception|Error|\[shots\]" "$GITHUB_WORKSPACE"/shots/player-*.log | head -80 || true
      - uses: actions/upload-artifact@v4
        if: matrix.targetPlatform == 'StandaloneLinux64'
        with:
          name: Craquez-screenshots
          path: shots
          retention-days: 14

  # versão: com "[publicar]" na mensagem do commit (ou uma tag v*), cria a tag v<versão do projeto>
  # e publica a Release só com o APK do Android (Windows/Linux suspensos até a aprovação)
  release:
    name: Publicar versão
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publicar]'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: art
      - uses: actions/checkout@v4
        with:
          sparse-checkout: docs
          path: src
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ProjectSettings
          path: ver
      - name: Preparar arquivos
        id: ver
        run: |
          V=$(grep -m1 "bundleVersion:" ver/ProjectSettings/ProjectSettings.asset | awk '{print $2}')
          TAG="v$V"
          [ "${GITHUB_REF_TYPE}" = "tag" ] && TAG="${GITHUB_REF_NAME}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          GITHUB_REF_NAME="$TAG"
          mkdir -p out && cp src/docs/RELEASE_NOTES.md out/NOTAS.md
          ls -R art | head -50
          mkdir -p out
          find art/Craquez-Android -name "*.apk" -exec cp {} out/Craquez-${GITHUB_REF_NAME}.apk \;
          find art/Craquez-TV -name "*.apk" -exec cp {} out/Craquez-TV-${GITHUB_REF_NAME}.apk \; 2>/dev/null || true
          ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Craquez ${{ steps.ver.outputs.tag }}
          body_path: ${{ github.workspace }}/out/NOTAS.md
          files: |
            out/*.apk
          fail_on_unmatched_files: false

  # versão "casa" (uso pessoal, sem fins comerciais): o mesmo APK com um option file de nomes reais
  # (clubes, estádios e elencos) gerado aqui a partir da base pública transfermarkt-datasets. Como o
  # repositório é público, o arquivo nunca é versionado nem vira artefato: o APK vai direto para um
  # RASCUNHO de release, que só quem administra o repositório enxerga.
  build-casa:
    name: Build Android (casa)
    needs: [check, license]
    if: needs.license.outputs.ok == 'true' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publicar]')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: true
          large-packages: false
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Option file casa (dados reais)
        run: |
          python3 tools/realdata/build_option_file.py Assets/Craquez/Resources/Data/option_file_casa.json .cache/realdata
          sed -i 's/^  productName: Craquez$/  productName: Craquez Casa/; s/    Android: com.hellisonvidal.craquez$/    Android: com.hellisonvidal.craquez.casa/' ProjectSettings/ProjectSettings.asset
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-Android-
      # chave de assinatura fixa do Android (no repositório: a versão nova instala por cima da antiga,
      # e a atualização por dentro do jogo funciona); os segredos ANDROID_KEYSTORE_* têm prioridade
      - name: Chave de assinatura
        run: echo "CRAQUEZ_KS=$(base64 -w0 tools/android/craquez.keystore)" >> "$GITHUB_ENV"
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          buildName: CraquezCasa
          versioning: None
          androidExportType: androidPackage
          # chave de assinatura fixa (segredos do repositório): sem ela cada build sai com uma chave de
          # depuração nova e o Android não aceita instalar a versão nova por cima (atualização pelo jogo)
          androidKeystoreName: craquez.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || env.CRAQUEZ_KS }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS || 'craquez2026' }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME || 'craquez' }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS || 'craquez2026' }}
          allowDirtyBuild: true
      - name: Rascunho de release (privado)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep -m1 "bundleVersion:" ProjectSettings/ProjectSettings.asset | awk '{print $2}')
          APK=$(find build/Android -name "*.apk" | head -1)
          cp "$APK" "Craquez-Casa-v$V.apk"
          gh release delete "casa-v$V" --yes --cleanup-tag 2>/dev/null || true
          gh release create "casa-v$V" "Craquez-Casa-v$V.apk" --draft --target "$GITHUB_SHA" --title "Craquez Casa v$V (uso pessoal)" \
            --notes "Versão para uso pessoal, sem fins comerciais: nomes reais de clubes, estádios e jogadores (base pública transfermarkt-datasets, jul/2026). Rascunho: visível só para quem administra o repositório. Não publique."
